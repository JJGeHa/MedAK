name: Watch SKAT templates

# Opens an issue when Skattestyrelsen publishes a new AKSA 2278 Excel template or a new
# version of the guidance. The engine and golden files then need checking.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Compare skat.dk with skat.lock
        id: check
        run: |
          set +e
          REPORT_FILE=report.md scripts/skat-watch/check.sh
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Open or update an issue
        if: steps.check.outputs.status == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="SKAT has published a new AKSA 2278 template or guidance"
          existing=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file report.md
          else
            gh issue create --title "$title" --body-file report.md
          fi

      - name: Fail if skat.dk could not be read
        if: steps.check.outputs.status != '0' && steps.check.outputs.status != '1'
        run: |
          echo "::error::Could not read skat.dk. The page layout may have changed; see the log above."
          exit 1
